name: Run Manual Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run build script
        run: python3 build.py
      - name: Upload Diagnostic Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-files
          path: diagnostic/
          
